[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cite-verify"
version = "0.1.0"
description = "Deterministic first-pass verification of legal citations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["eyecite"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
cite-verify = "cite_verify.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
